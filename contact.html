<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Chester</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-light bg-light shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html">Chester</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#projects">Projects</a></li>
            <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
            <li class="nav-item active"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="mt-5 pt-4">
      <div class="container">
        <header class="mb-4 text-center">
          <h1 class="display-5">Get in touch</h1>
          <p class="text-muted">Have a project, question, or opportunity? Send me a message.</p>
        </header>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title">Contact Form</h5>
                <form id="contactForm">
                  <div class="form-row">
                    <div class="form-group col-md-6">
                      <label for="name">Name</label>
                      <input type="text" id="name" class="form-control" placeholder="Your name" required>
                    </div>
                    <div class="form-group col-md-6">
                      <label for="email">Email</label>
                      <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" class="form-control" placeholder="How can I help?" required>
                  </div>
                  <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" class="form-control" rows="6" placeholder="Write your message here..." required></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary">Send Email</button>
                  <span id="formStatus" class="ml-3 text-success" style="display:none;">Opening your email app…</span>
                </form>
                <hr>
                <p class="mb-1">Prefer email?</p>
                <p class="mb-0"><a href="mailto:chesterm233@gmail.com">chesterm233@gmail.com</a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

        <script src="javascript/lightbox.js"></script>
    <script>
      // Simple mailto-based form submit (no backend required)
      document.getElementById('contactForm').addEventListener('submit', function(e){
        e.preventDefault();
        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var subject = document.getElementById('subject').value.trim();
        var message = document.getElementById('message').value.trim();
        var body = encodeURIComponent("From: " + name + " (" + email + ")\n\n" + message);
        var mailto = 'mailto:chesterm233@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + body;
        document.getElementById('formStatus').style.display = 'inline';
        window.location.href = mailto;
      });
    </script>
  </body>
</html>
